<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberMe · 今日工作区 Mock</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="shell" aria-label="预览控制">
  <span class="shell-name">CyberMe · 今日工作区原型</span>
  <span class="shell-badge">合成演示数据 · 不执行真实操作</span>
  <span class="shell-spacer"></span>
  <label class="shell-toggle"><input type="checkbox" id="demo-source-change"> 模拟来源变化</label>
  <button type="button" class="shell-btn" id="demo-reset">重置</button>
</header>
<div class="stage" id="stage">
  <div class="window" id="window" role="application" aria-label="CyberMe">
    <section class="chat" aria-label="主对话">
      <div class="chat-head">
        <span class="avatar" aria-hidden="true">C</span>
        <div><div class="chat-title">CyberMe</div><div class="chat-sub">主对话</div></div>
      </div>
      <div class="messages" id="messages" aria-live="polite"></div>
      <form class="composer" id="composer">
        <div class="ref-slot" id="ref-slot"></div>
        <div class="composer-row">
          <textarea id="draft" rows="2" placeholder="继续交代，或追问一张卡片" aria-label="主对话输入"></textarea>
          <button type="submit" class="send" id="send" aria-label="发送">↑</button>
        </div>
      </form>
    </section>
    <section class="work" aria-label="工作区">
      <nav class="tabs" id="tabs" aria-label="主导航">
        <a href="#today" data-tab="today">今天</a>
        <a href="#tasks" data-tab="tasks">任务</a>
        <a href="#memory" data-tab="memory">记忆</a>
      </nav>
      <div class="view" id="view"></div>
    </section>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
