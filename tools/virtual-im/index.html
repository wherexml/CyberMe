<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual IM · 工作消息模拟器</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="error" role="alert" hidden></div><div class="app">
<nav class="rail"><div class="brand">V<span>·</span></div><div class="rail-item active">◫<small>消息</small></div><button id="tasks-toggle" class="rail-item">☑<small>待处理</small></button><div class="rail-bottom"><span class="self">S</span><small>Steve</small></div></nav>
<aside class="sidebar"><header><div class="eyebrow">WORKSPACE / 本地模拟</div><h1>虚拟 IM <span class="badge">LAB</span></h1><div class="search"><span>⌕</span><input id="search" aria-label="搜索会话" placeholder="搜索会话或消息"></div><div class="tabs"><button id="all" class="selected">全部</button><button id="unread">未读</button></div></header><div id="conversations"></div><div class="simulator"><div class="sim-title"><span id="live-dot"></span><strong id="live-status">持续来信中</strong><button id="toggle" aria-label="暂停来信">Ⅱ</button></div><div class="setting-label">来信节奏</div><div class="segments" id="speeds"><button data-speed="60">轻松</button><button data-speed="20">日常</button><button data-speed="5">密集</button></div><div class="setting-label">场景</div><div class="segments" id="modes"><button data-mode="mixed">综合</button><button data-mode="daily">协作</button><button data-mode="pressure">突发</button></div><button class="generate" id="generate">＋ 立即来一条</button><a href="/api/export" class="export">导出本次记录 ↗</a></div></aside>
<main><header class="chat-header"><button id="back" aria-label="返回会话">‹</button><div id="chat-avatar"></div><div><h2 id="chat-title"></h2><p id="chat-subtitle"></p></div><button id="open-persona" class="persona-button">角色设置</button><span id="provider-state" class="local-label">模拟会话</span></header><div id="messages" aria-label="聊天记录"></div><div id="ai-status" role="status" hidden></div><button id="new-message" hidden>有新消息 ↓</button><form id="composer"><div class="composer-tools"><span>文字消息</span><span id="draft-status"></span></div><textarea id="draft" maxlength="4000" placeholder="回复消息…" aria-label="回复消息"></textarea><footer><span>Enter 发送 · Shift + Enter 换行</span><div class="send-actions"><button id="recover-send" type="button" hidden>确认上次发送</button><button class="primary" id="send" type="submit">发送 ↑</button></div></footer></form></main>
<aside class="inspector"><header><div class="eyebrow">FOLLOW THROUGH</div><h2>待处理事项 <span id="pending-count"></span></h2><div class="tabs"><button id="pending-tab" class="selected">待处理</button><button id="handled-tab">已处理</button></div></header><div id="tasks"></div><footer><span class="outline-dot"></span>只在虚拟工作区内流转</footer></aside></div><dialog id="persona-dialog"><form id="persona-form"><header><div><div class="eyebrow">PERSONA</div><h2>角色设置</h2></div><button type="button" id="close-persona" aria-label="关闭角色设置">×</button></header><label>姓名<input name="name" required maxlength="80"></label><label>岗位<input name="role" required maxlength="120"></label><label>人物背景<textarea name="background" maxlength="2000"></textarea></label><label>回复风格<textarea name="style" required maxlength="2000"></textarea></label><label>补充设定<textarea name="instructions" maxlength="2000"></textarea></label><p id="persona-error" role="alert"></p><button type="button" id="reload-persona" hidden>读取当前设置</button><footer><span id="persona-model"></span><button type="submit" class="primary">保存</button></footer></form></dialog><script type="module" src="/app.js"></script></body></html>
