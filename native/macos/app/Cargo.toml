[package]
name = "opstwin-app"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "opstwin"
path = "src/main.rs"

[dependencies]
opstwin-api = { path = "../crates/opstwin-api" }
gpui-kit.workspace = true
tokio.workspace = true
serde_json.workspace = true
opstwin-store = { path = "../crates/opstwin-store" }
serde.workspace = true
sha2.workspace = true
chrono = "=0.4.45"

# Existing locked dependencies, exposed directly for GPUI image GET transport.
http_client = { package = "gpui-pre-http-client", version = "=0.3.7" }
reqwest.workspace = true
futures-util.workspace = true
anyhow = "1"

# Public macOS composition APIs; versions already present in Cargo.lock.
objc2 = "=0.6.4"
objc2-core-foundation = "=0.3.2"
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSGeometry", "NSString", "NSValue"] }
raw-window-handle = "=0.6.2"
