[workspace]
members = ["crates/opstwin-api", "app", "acceptance"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
# gpui-kit 0.7.0 (git tag v0.7.0 = 0c830f4d257e69fdd17200650533ab4ca9a40cc0)
# pins GPUI snapshot gpui-pre =0.3.7 exactly.
gpui-kit = { version = "=0.7.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
thiserror = "2"

[profile.release]
debug = false
