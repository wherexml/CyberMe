<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpsTwins · 灵感备用图标</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:48px;background:#fafbfc;color:#252831;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1000px;margin:auto}h1{font-size:26px;margin:0 0 12px}p{color:#69717d;line-height:1.7;margin:0 0 28px}nav{display:flex;gap:8px;margin:24px 0}button{font:inherit;color:inherit;background:#fff;border:1px solid #e4e7ed;border-radius:8px;padding:9px 16px;cursor:pointer}button[aria-pressed=true]{background:#e8effd;color:#356ee8;border-color:#c9d8f6}button:focus-visible{outline:2px solid #356ee8;outline-offset:3px}#icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}article{background:#fff;border:1px solid #e9ecf1;border-radius:14px;padding:24px;min-width:0}article .sizes{display:flex;align-items:center;gap:18px;height:64px;margin-bottom:18px}img{display:block;width:56px;height:56px}.small{width:24px;height:24px}h2{font-size:14px;font-weight:550;margin:0 0 7px}code{color:#7b8290;font-size:11px}body[data-treatment=soft] img{filter:saturate(.45)}body[data-treatment=mono] img{filter:grayscale(1)}footer{margin-top:30px;color:#7b8290;font-size:12px;line-height:1.8}@media(max-width:700px){body{padding:28px 20px}#icons{grid-template-columns:repeat(2,minmax(0,1fr))}article{padding:18px}}
</style>
<main>
<h1>灵感 · 备用图标</h1>
<p>12 个原创小物件，轻微厚度、柔和配色。每格同时展示 56px 与 24px；卡片中使用 44px。</p>
<nav aria-label="图标配色"><button data-mode="color" aria-pressed="true">彩色</button><button data-mode="soft" aria-pressed="false">柔和彩色</button><button data-mode="mono" aria-pressed="false">单色</button></nav>
<div id="icons"></div>
<footer>周报、会议、摘要、跟进、自动化、洞察、研究、提醒、文件、流程、安全、账单。<br>仅用于 HTML 设计稿；可单独复用 SVG。<a href="macos-ui-study.html">返回设计稿</a></footer>
</main>
<script src="macos-idea-icons.js"></script>
<script>
const root=document.querySelector('#icons');
for(const [key,label] of Object.entries(OpsTwinsIdeaIcons.labels)){
 const card=document.createElement('article'),sizes=document.createElement('div');sizes.className='sizes';
 const large=OpsTwinsIdeaIcons.create({iconKey:key}),small=OpsTwinsIdeaIcons.create({iconKey:key});small.classList.add('small');sizes.append(large,small);
 const title=document.createElement('h2');title.textContent=label;const name=document.createElement('code');name.textContent=key+'.svg';card.append(sizes,title,name);root.append(card);
}
function mode(value){document.body.dataset.treatment=value;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===value))}
try{const saved=localStorage.getItem('opstwins-idea-icon-treatment');if(['color','soft','mono'].includes(saved))mode(saved)}catch{}
for(const button of document.querySelectorAll('[data-mode]'))button.onclick=()=>{mode(button.dataset.mode);try{localStorage.setItem('opstwins-idea-icon-treatment',button.dataset.mode)}catch{}};
</script>
</html>
